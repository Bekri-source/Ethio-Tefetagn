<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem("et_theme");if(t==="dark"||(!t&&window.matchMedia("(prefers-color-scheme: dark)").matches)){document.documentElement.setAttribute("data-theme","dark");}}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Dashboard — Ethio Tefetagn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
</button>

<header class="site">
  <div class="bar">
    <a class="brand" href="index.html">
      <svg class="brand-mark" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <ellipse cx="20" cy="10" rx="6" ry="10" fill="#E8A93A"/>
        <ellipse cx="20" cy="10" rx="6" ry="10" fill="#1E5631" transform="rotate(60 20 20)"/>
        <ellipse cx="20" cy="10" rx="6" ry="10" fill="#A13D2B" transform="rotate(120 20 20)"/>
        <ellipse cx="20" cy="10" rx="6" ry="10" fill="#E8A93A" transform="rotate(180 20 20)"/>
        <ellipse cx="20" cy="10" rx="6" ry="10" fill="#1E5631" transform="rotate(240 20 20)"/>
        <ellipse cx="20" cy="10" rx="6" ry="10" fill="#A13D2B" transform="rotate(300 20 20)"/>
        <circle cx="20" cy="20" r="6" fill="#E8A93A" stroke="#C98423" stroke-width="1.5"/>
      </svg>
      <span class="brand-name">Ethio <em>Tefetagn</em></span>
    </a>
    <button class="nav-toggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="dashboard.html?stream=natural" id="nav-natural">Natural Science</a>
      <a href="dashboard.html?stream=social" id="nav-social">Social Science</a>
      <a href="chatbot.html">AI Study Assistant</a>
      <a href="library.html">Library</a>
    </nav>
  </div>
</header>

<div class="wrap">
  <div class="dash-head">
    <div>
      <p class="eyebrow" id="stream-eyebrow">Stream</p>
      <h1 id="stream-title">Your subjects</h1>
    </div>
    <span class="visit-chip">
      <span class="visit-dot"></span>
      <strong id="visit-count">…</strong>
      <span id="visit-label">visitors</span>
    </span>
  </div>

  <div class="readiness">
    <div id="bloom-holder" class="bloom-wrap"></div>
    <div class="readiness-legend" id="legend"></div>
  </div>

  <div class="subject-grid" id="subject-grid"></div>
</div>

<footer class="site">
  <div class="wrap">
    <span>© <span id="year"></span> Ethio Tefetagn — built for Ethiopian ESSLCE candidates.</span>
    <a href="index.html">← Back home</a>
  </div>
</footer>

<script src="js/config.js"></script>
<script src="js/questions.js"></script>
<script src="js/bloom.js"></script>
<script src="js/main.js"></script>
<script>
document.getElementById("year").textContent = new Date().getFullYear();

const params = new URLSearchParams(window.location.search);
const streamKey = STREAMS[params.get("stream")] ? params.get("stream") : "natural";
const stream = STREAMS[streamKey];

document.getElementById("stream-eyebrow").textContent = stream.name + " stream";
document.getElementById("stream-title").textContent = "Your subjects";
document.getElementById("nav-" + streamKey).classList.add("active");

const petals = stream.subjects.map(id => ({
  label: SUBJECT_META[id].name,
  color: SUBJECT_META[id].color,
  progress: getProgress(id)
}));
document.getElementById("bloom-holder").innerHTML = renderBloom(petals);

const legend = document.getElementById("legend");
petals.forEach(p => {
  const row = document.createElement("div");
  row.className = "legend-row";
  row.innerHTML = `<span class="legend-swatch" style="background:${p.color}"></span>
    <span>${p.label}</span><span class="pct">${p.progress}%</span>`;
  legend.appendChild(row);
});

const grid = document.getElementById("subject-grid");
stream.subjects.forEach(id => {
  const meta = SUBJECT_META[id];
  const progress = getProgress(id);
  const qCount = (QUESTION_BANK[id] || []).length;
  const card = document.createElement("a");
  card.href = `quiz.html?subject=${id}&stream=${streamKey}`;
  card.className = "subject-card";
  card.style.textDecoration = "none";
  card.innerHTML = `
    <div class="top">
      <h3>${meta.name}</h3>
      <svg class="subject-icon" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="20" cy="20" r="17" fill="${meta.color}" fill-opacity="0.15"/>
        <circle cx="20" cy="20" r="10" fill="${meta.color}"/>
      </svg>
    </div>
    <div class="progress-bar"><span style="width:${progress}%;background:${meta.color}"></span></div>
    <div class="meta"><span>${progress}% mastery</span><span>${qCount} questions</span></div>
  `;
  grid.appendChild(card);
});
</script>
</body>
</html>
